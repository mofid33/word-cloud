app:
  name: "Persian Semantic Text Analytics Service"
  version: "0.1.0"
server:
  host: "0.0.0.0"
  port: 5000
api:
  prefix: "/api/v1"
database:
  pool_pre_ping: true
  pool_size: 10
  max_overflow: 20
  pool_timeout_seconds: 30
vault:
  enabled: false
models:
  cache_dir: "/var/lib/word-cloud/models"
  allow_remote_downloads: false
  trust_remote_code: false
device:
  type: "cpu"
  cuda_device_index: 0
batch:
  default_size: 32
  max_size: 128
analysis:
  limits:
    max_documents_per_analysis: 5000
    max_characters_per_document: 500000
    max_total_characters_per_analysis: 10000000
  sync_threshold:
    max_documents: 20
    max_total_characters: 100000

persian_nlp:
  resources:
    path: "src/infrastructure/resources/persian_nlp/persian_nlp_resources.json"
  lemmatization:
    enabled: true
  pos_processing:
    enabled: true
  embedding:
    remove_stopwords: false
    use_lemmas: false

candidate_extraction:
  minimum_ngram: 1
  maximum_ngram: 3
  maximum_phrase_characters: 120
  filter_pure_numeric: true
  preserve_four_digit_year: true
  filter_stopword_unigrams: true
  filter_edge_stopwords: true
  reject_function_pos_unigrams: true

statistical_analysis:
  weights:
    frequency: 0.3333333333333333
    document_coverage: 0.3333333333333333
    phrase_quality: 0.3333333333333334

semantic:
  embedding:
    model_identifier: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
    model_revision: null
    batch_size: 32
    max_length: 512
  reranker:
    model_identifier: "BAAI/bge-reranker-v2-m3"
    model_revision: null
    batch_size: 16
    max_length: 512

semantic_analysis:
  rerank_top_n: 25

hybrid_ranking:
  normalization_strategy: "min_max"
  baseline_weights:
    statistical: 0.5
    semantic: 0.5
  lexical_deduplication_threshold: 0.92
  semantic_deduplication_threshold: 0.95
  mmr_lambda: 0.7
  diversity_candidate_pool_size: 50
  maximum_ranked_results: 25

analysis_profiles:
  course:
    scoring_version: "phase10-course-baseline-v2"
    maximum_results: 25
    diversity_candidate_pool_size: 200
    weights:
      semantic_relevance: 0.35
      frequency: 0.20
      chunk_coverage: 0.15
      section_coverage: 0.15
      phrase_quality: 0.15
  soldier_concern:
    scoring_version: "phase11-soldier-topic-v1"
    maximum_results: 25
    diversity_candidate_pool_size: 50
    weights:
      document_frequency: 0.30
      document_coverage: 0.25
      semantic_relevance: 0.35
      topic_prevalence: 0.10
  media:
    scoring_version: "phase11-media-trend-v1"
    maximum_results: 25
    diversity_candidate_pool_size: 50
    weights:
      mention_share: 0.30
      semantic_relevance: 0.35
      coverage: 0.20
      normalized_engagement: 0.00
      trend_growth: 0.10
      recency: 0.05

topic_model:
  similarity_threshold: 0.58
  maximum_topics: 12

topic_analysis:
  representative_keyphrases: 5
  media_gap_similarity_threshold: 0.30
  scoring_version: "phase11-topic-baseline-v2"

trend_analysis:
  window_days: 7
  minimum_documents_per_window: 2
  growth_threshold: 0.10
  minimum_prevalence: 0.05
  scoring_version: "phase11-trend-baseline-v1"
